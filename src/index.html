<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle Financeiro Pessoal Estudantil</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Controle Financeiro Pessoal Estudantil</h1>
    <div id="usuarioInfo"></div>
  </header>

  <main>
    <section class="resumo">
      <h2>Resumo do Mês</h2>
      <p>Receitas: <span id="totalReceitas">R$ 0,00</span></p>
      <p>Despesas: <span id="totalDespesas">R$ 0,00</span></p>
      <p>Saldo: <span id="saldo">R$ 0,00</span></p>
    </section>

    <section class="formulario">
      <h2>Novo Lançamento</h2>
      <form id="formLancamento">
        <label>Descrição:
          <input type="text" id="descricao" required>
        </label>

        <label>Valor (R$):
          <input type="number" id="valor" step="0.01" required>
        </label>

        <label>Data:
          <input type="date" id="data" required>
        </label>

        <label>Categoria:
          <select id="categoria" required>
            <option value="Bolsa">Bolsa</option>
            <option value="Auxílio">Auxílio</option>
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Material Escolar">Material Escolar</option>
            <option value="Moradia">Moradia</option>
            <option value="Lazer">Lazer</option>
            <option value="Outros">Outros</option>
          </select>
        </label>

        <label>Tipo:
          <select id="tipo" required>
            <option value="receita">Receita</option>
            <option value="despesa">Despesa</option>
          </select>
        </label>

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section class="lista">
      <h2>Lançamentos</h2>

      <div class="filtros">
        <label>Categoria:
          <select id="filtroCategoria">
            <option value="Bolsa">Bolsa</option>
            <option value="Auxílio">Auxílio</option>
            <option value="Alimentação">Alimentação</option>
            <option value="Transporte">Transporte</option>
            <option value="Material Escolar">Material Escolar</option>
            <option value="Moradia">Moradia</option>
            <option value="Lazer">Lazer</option>
            <option value="Outros">Outros</option>
          </select>
          </select>
        </label>

        <label>De:
          <input type="date" id="filtroDataInicio">
        </label>

        <label>Até:
          <input type="date" id="filtroDataFim">
        </label>

        <button type="button" id="limparFiltros">Limpar filtros</button>
      </div>

      <ul id="listaLancamentos"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
